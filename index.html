<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unicorn Marketers - Marketing Scorecards</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root {
      --brand-primary: #2483C4;
      --brand-primary-light: #4DA3E0;
      --brand-primary-glow: rgba(36, 131, 196, 0.15);
      --navy-dark: #191E28;
      --navy-surface: #1f2533;
      --cyan-accent: #00aae9;
      --success: #28c840;
      --error: #ff5f57;
      --warning: #febc2e;
      --white: #ffffff;
      --text-primary: #191E28;
      --text-muted: #9ca3af;
      --text-secondary: #555e6b;
      --bg-light: #f3fbff;
      --bg-page: #f8fafb;
      --card-border: rgba(25, 30, 40, 0.08);
      --card-border-hover: rgba(25, 30, 40, 0.16);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== TAB BAR ===== */
    .tab-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--navy-dark);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .tab-pills {
      display: flex;
      gap: 6px;
    }
    .tab-pill {
      padding: 7px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .tab-pill:hover {
      color: var(--white);
      background: rgba(255,255,255,0.06);
    }
    .tab-pill.active {
      background: var(--brand-primary);
      color: var(--white);
      border-color: var(--brand-primary);
    }
    .tab-bar-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    @media (max-width: 600px) {
      .tab-bar { flex-direction: column; gap: 6px; }
      .tab-bar-label { display: none; }
      .tab-pill { padding: 6px 12px; font-size: 12px; }
    }

    /* ===== TAB CONTENT ===== */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ===== HERO ===== */
    .hero {
      background: var(--navy-dark);
      padding: 48px 24px 56px;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -40%;
      right: -15%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--brand-primary-glow) 0%, transparent 70%);
      border-radius: 50%;
    }
    .hero::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(0, 170, 233, 0.06) 0%, transparent 70%);
      border-radius: 50%;
    }
    .hero-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(36, 131, 196, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(36, 131, 196, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .hero-content {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }
    .badge {
      display: inline-block;
      background: rgba(36, 131, 196, 0.12);
      border: 1px solid rgba(36, 131, 196, 0.25);
      color: var(--brand-primary-light);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 20px;
    }
    .hero h1 {
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 800;
      color: var(--white);
      margin-bottom: 6px;
      line-height: 1.2;
    }
    .hero h1 span { color: var(--brand-primary-light); }
    .hero-subtitle {
      color: var(--text-muted);
      font-size: 16px;
      margin-bottom: 36px;
    }
    .hero-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    .hero-stat {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(10px);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .hero-stat:hover {
      transform: translateY(-2px);
      border-color: rgba(36, 131, 196, 0.3);
    }
    .hero-stat-value {
      font-size: 36px;
      font-weight: 800;
      color: var(--brand-primary-light);
      line-height: 1;
      margin-bottom: 4px;
    }
    .hero-stat-value.green { color: var(--success); }
    .hero-stat-value.cyan { color: var(--cyan-accent); }
    .hero-stat-label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .hero-stat-change {
      font-size: 11px;
      font-weight: 600;
      margin-top: 6px;
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-block;
    }
    .hero-stat-change.up { background: rgba(40, 200, 64, 0.15); color: #28c840; }
    .hero-stat-change.down { background: rgba(255, 95, 87, 0.15); color: #ff5f57; }
    .hero-stat-change.flat { background: rgba(156, 163, 175, 0.15); color: #9ca3af; }

    /* MoM BADGES (inline) */
    .mom-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .mom-badge.up { background: rgba(40, 200, 64, 0.12); color: #1a7a2d; }
    .mom-badge.down { background: rgba(255, 95, 87, 0.12); color: #cc3d36; }
    .mom-badge.flat { background: rgba(156, 163, 175, 0.12); color: #777; }

    /* ===== MAIN ===== */
    .main {
      max-width: 1200px;
      margin: -24px auto 0;
      padding: 0 24px 60px;
      position: relative;
      z-index: 2;
    }

    /* NOTE BANNER */
    .note-banner {
      background: var(--white);
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--brand-primary);
      border-radius: 8px;
      padding: 14px 20px;
      margin-bottom: 24px;
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .note-banner strong { color: var(--text-primary); }

    /* SECTION CARDS */
    .section {
      background: var(--white);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 24px;
      border: 1px solid var(--card-border);
      transition: border-color 0.2s ease;
    }
    .section:hover { border-color: var(--card-border-hover); }
    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .section-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .section-icon.blue { background: rgba(36, 131, 196, 0.1); }
    .section-icon.green { background: rgba(40, 200, 64, 0.1); }
    .section-icon.gold { background: rgba(254, 188, 46, 0.1); }
    .section-icon.red { background: rgba(255, 95, 87, 0.1); }
    .section-icon.purple { background: rgba(139, 92, 246, 0.1); }
    .section-icon.cyan-bg { background: rgba(0, 170, 233, 0.1); }
    .section-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--navy-dark);
    }
    .section-subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* METRIC GRID */
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
    }
    .metric-card {
      background: var(--bg-light);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    .metric-card-value {
      font-size: 28px;
      font-weight: 800;
      color: var(--navy-dark);
      line-height: 1;
      margin-bottom: 4px;
    }
    .metric-card-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .metric-card-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* PIPELINE */
    .pipeline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 24px 0;
      overflow-x: auto;
    }
    .pipeline-stage { flex: 1; min-width: 100px; text-align: center; }
    .pipeline-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 8px;
      font-size: 22px;
      font-weight: 800;
      color: white;
    }
    .pipeline-circle.step1 { background: linear-gradient(135deg, var(--brand-primary), var(--brand-primary-light)); }
    .pipeline-circle.step2 { background: linear-gradient(135deg, var(--brand-primary), var(--brand-primary-light)); }
    .pipeline-circle.step2b { background: linear-gradient(135deg, #1a7ab5, var(--cyan-accent)); }
    .pipeline-circle.step3 { background: linear-gradient(135deg, #d4960c, var(--warning)); }
    .pipeline-circle.step4 { background: linear-gradient(135deg, #1e9e38, var(--success)); }
    .pipeline-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
    .pipeline-sub { font-size: 11px; color: var(--text-muted); }
    .pipeline-arrow { color: #cbd5e1; font-size: 20px; flex-shrink: 0; }

    /* TABLES */
    .source-table { width: 100%; border-collapse: separate; border-spacing: 0; }
    .source-table th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 10px 16px;
      border-bottom: 2px solid rgba(25, 30, 40, 0.06);
    }
    .source-table th.right { text-align: right; }
    .source-table td {
      padding: 12px 16px;
      font-size: 14px;
      border-bottom: 1px solid rgba(25, 30, 40, 0.04);
      color: var(--text-primary);
    }
    .source-table td.right { text-align: right; }
    .source-table tr:last-child td { border-bottom: none; }

    .source-tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    .source-tag.meta { background: rgba(36, 131, 196, 0.1); color: var(--brand-primary); }
    .source-tag.cold { background: rgba(254, 188, 46, 0.12); color: #a37800; }
    .source-tag.organic { background: rgba(40, 200, 64, 0.1); color: #1a7a2d; }
    .source-tag.google { background: rgba(255, 95, 87, 0.1); color: #cc3d36; }
    .source-tag.other { background: rgba(25, 30, 40, 0.06); color: var(--text-secondary); }
    .source-tag.referral { background: rgba(139, 92, 246, 0.1); color: #6b3fc7; }
    .source-tag.hampton { background: rgba(0, 170, 233, 0.1); color: #0088bb; }
    .source-tag.ba { background: rgba(139, 92, 246, 0.08); color: #7c3aed; }
    .source-tag.wolf { background: rgba(245, 158, 11, 0.1); color: #b45309; }
    .source-tag.ikoni { background: rgba(236, 72, 153, 0.1); color: #be185d; }

    .bar-container { width: 80px; height: 8px; background: rgba(25, 30, 40, 0.06); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; }
    .bar-fill.meta { background: linear-gradient(90deg, var(--brand-primary), var(--brand-primary-light)); }
    .bar-fill.cold { background: linear-gradient(90deg, #d4960c, var(--warning)); }
    .bar-fill.organic { background: linear-gradient(90deg, #1e9e38, var(--success)); }
    .bar-fill.google { background: linear-gradient(90deg, #cc3d36, var(--error)); }
    .bar-fill.other { background: linear-gradient(90deg, #6b7280, #9ca3af); }
    .bar-fill.referral { background: linear-gradient(90deg, #6b3fc7, #8b5cf6); }

    /* No-show rate badge */
    .rate-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }
    .rate-badge.good { background: rgba(40, 200, 64, 0.1); color: #1a7a2d; }
    .rate-badge.warn { background: rgba(254, 188, 46, 0.12); color: #a37800; }
    .rate-badge.bad { background: rgba(255, 95, 87, 0.1); color: #cc3d36; }

    .cac-table { width: 100%; border-collapse: separate; border-spacing: 0; }
    .cac-table th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 10px 16px;
      border-bottom: 2px solid rgba(25, 30, 40, 0.06);
    }
    .cac-table th.right { text-align: right; }
    .cac-table td {
      padding: 10px 16px;
      font-size: 13px;
      border-bottom: 1px solid rgba(25, 30, 40, 0.04);
      color: var(--text-primary);
    }
    .cac-table td.right { text-align: right; font-weight: 600; }
    .cac-table tr:last-child td { border-bottom: none; }

    /* DEALS */
    .deal-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(25, 30, 40, 0.04);
      gap: 16px;
    }
    .deal-item:last-child { border-bottom: none; }
    .deal-number {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-primary-light));
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .deal-info { flex: 1; }
    .deal-name { font-size: 14px; font-weight: 600; color: var(--navy-dark); }
    .deal-source { font-size: 11px; margin-top: 2px; }
    .deal-amount { font-size: 14px; font-weight: 700; color: var(--success); white-space: nowrap; }

    /* SUMMARY ROW */
    .summary-row {
      background: var(--navy-dark);
      border-radius: 10px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
    }
    .summary-row span { color: var(--text-muted); font-size: 13px; font-weight: 500; }
    .summary-row strong { color: var(--white); font-size: 16px; font-weight: 700; }

    /* TWO COL */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 768px) {
      .two-col { grid-template-columns: 1fr; }
      .hero-stats { grid-template-columns: repeat(2, 1fr); }
    }

    .footer {
      text-align: center;
      padding: 32px 24px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .chart-container { position: relative; height: 260px; margin-top: 16px; }
    .chart-container-tall { position: relative; height: 340px; margin-top: 16px; }

    /* INVESTMENT TABLE */
    .invest-table { width: 100%; border-collapse: separate; border-spacing: 0; }
    .invest-table th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 10px 16px;
      border-bottom: 2px solid rgba(25, 30, 40, 0.06);
    }
    .invest-table th.right { text-align: right; }
    .invest-table td {
      padding: 12px 16px;
      font-size: 14px;
      border-bottom: 1px solid rgba(25, 30, 40, 0.04);
      color: var(--text-primary);
    }
    .invest-table td.right { text-align: right; font-weight: 600; }
    .invest-table tr:last-child td { border-bottom: none; }
    .invest-table .total-row td {
      font-weight: 700;
      border-top: 2px solid rgba(25, 30, 40, 0.1);
      background: var(--bg-light);
    }
    .invest-row { cursor: pointer; transition: background 0.15s ease; }
    .invest-row:hover { background: var(--bg-light); }
    .invest-row .expand-icon {
      display: inline-block;
      transition: transform 0.2s ease;
      font-size: 12px;
      color: var(--text-muted);
      margin-right: 8px;
    }
    .invest-row.expanded .expand-icon { transform: rotate(90deg); }
    .invest-detail { display: none; }
    .invest-detail.show { display: table-row; }
    .invest-detail td {
      padding: 0 16px 16px 48px;
      font-size: 13px;
      color: var(--text-secondary);
      border-bottom: 1px solid rgba(25, 30, 40, 0.04);
    }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      padding: 12px 0;
    }
    .detail-item {
      background: var(--bg-light);
      border-radius: 8px;
      padding: 10px 14px;
    }
    .detail-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .detail-value {
      font-size: 16px;
      font-weight: 700;
      color: var(--navy-dark);
      margin-top: 2px;
    }

    /* TYPEFORM FUNNEL */
    .funnel-visual {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin: 20px 0;
    }
    .funnel-step {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .funnel-bar-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .funnel-bar {
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding-left: 16px;
      font-size: 14px;
      font-weight: 700;
      color: white;
      transition: width 0.6s ease;
      min-width: 60px;
    }
    .funnel-step-label {
      width: 100px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      text-align: right;
      flex-shrink: 0;
    }
    .funnel-step-pct {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      width: 50px;
      flex-shrink: 0;
    }
    .funnel-drop {
      font-size: 11px;
      color: var(--text-muted);
      padding: 4px 0 4px 116px;
    }

    /* L90 SPECIFIC */
    .l90-hero {
      background: linear-gradient(135deg, #0f1520 0%, var(--navy-dark) 50%, #1a2538 100%);
    }
    .trend-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 6px;
    }
    .trend-indicator.up-good { background: rgba(40, 200, 64, 0.1); color: #1a7a2d; }
    .trend-indicator.down-bad { background: rgba(255, 95, 87, 0.1); color: #cc3d36; }
    .trend-indicator.down-good { background: rgba(40, 200, 64, 0.1); color: #1a7a2d; }
    .trend-indicator.up-bad { background: rgba(255, 95, 87, 0.1); color: #cc3d36; }
    .trend-indicator.stable { background: rgba(254, 188, 46, 0.1); color: #a37800; }
    .trend-indicator.critical { background: rgba(255, 95, 87, 0.2); color: #cc3d36; font-weight: 700; }

    .forecast-table { width: 100%; border-collapse: separate; border-spacing: 0; }
    .forecast-table th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 10px 16px;
      border-bottom: 2px solid rgba(25, 30, 40, 0.06);
    }
    .forecast-table th.right { text-align: right; }
    .forecast-table td {
      padding: 10px 16px;
      font-size: 13px;
      border-bottom: 1px solid rgba(25, 30, 40, 0.04);
      color: var(--text-primary);
    }
    .forecast-table td.right { text-align: right; font-weight: 600; }
    .forecast-table tr:last-child td { border-bottom: none; }

    .cac-bar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .cac-bar-label {
      width: 130px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      text-align: right;
      flex-shrink: 0;
    }
    .cac-bar-track {
      flex: 1;
      height: 28px;
      background: rgba(25, 30, 40, 0.04);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .cac-bar-fill {
      height: 100%;
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding-left: 10px;
      font-size: 12px;
      font-weight: 700;
      color: white;
      min-width: fit-content;
      padding-right: 10px;
    }
    .cac-bar-fill.green { background: linear-gradient(90deg, #1e9e38, var(--success)); }

const monthOrder = ['mar', 'apr', 'may', 'jun', 'jul'];

// ===== UTILITY FUNCTIONS =====
function fmt(n) { return n.toLocaleString('en-US'); }
function fmtD(n) { return '$' + n.toLocaleString('en-US'); }
function fmtDec(n) { return '$' + n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
function pct(n) { return n.toFixed(1) + '%'; }

function momPct(cur, prev) {
  if (prev === 0) return { val: 'N/A', cls: 'flat' };
  var change = ((cur - prev) / prev * 100);
  var sign = change >= 0 ? '+' : '';
  var cls = change > 0 ? 'up' : change < 0 ? 'down' : 'flat';
  return { val: sign + change.toFixed(1) + '%', cls: cls };
}

function momPP(cur, prev) {
  var change = cur - prev;
  var sign = change >= 0 ? '+' : '';
  var cls = change > 0 ? 'up' : change < 0 ? 'down' : 'flat';
  return { val: sign + change.toFixed(1) + 'pp', cls: cls };
}

// For hero stat, invert "good" direction for some metrics
function heroMomBadge(cur, prev, isRate) {
  if (prev === undefined) return '';
  var m = isRate ? momPP(cur, prev) : momPct(cur, prev);
  return '<div class="hero-stat-change ' + m.cls + '">' + m.val + ' MoM</div>';
}

function inlineMomBadge(cur, prev, isRate) {
  if (prev === undefined) return '';
  var m = isRate ? momPP(cur, prev) : momPct(cur, prev);
  return '<span class="mom-badge ' + m.cls + '">' + m.val + '</span>';
}

function sourceTagClass(source) {
  var s = source.toLowerCase();
  if (s.includes('meta')) return 'meta';
  if (s.includes('cold')) return 'cold';
  if (s.includes('organic') || s.includes('unknown') || s === 'n/a') return 'organic';
  if (s.includes('google')) return 'google';
  if (s.includes('referral') || s.includes('personal')) return 'referral';
  if (s.includes('hampton')) return 'hampton';
  if (s.includes('board') || s.includes('advisor')) return 'ba';
  if (s.includes('wolf')) return 'wolf';
  if (s.includes('ikoni')) return 'ikoni';
  return 'other';
}

function toggleDetail(row) {
  var detail = row.nextElementSibling;
  row.classList.toggle('expanded');
  detail.classList.toggle('show');
}

// L90 averages for comparison badges (May+Jun+Jul)
var l90Avgs = null;
function getL90Avgs() {
  if (l90Avgs) return l90Avgs;
  var keys = ['may','jun','jul'];
  var b=0,s=0,a=0,dc=0,r=0;
  keys.forEach(function(k){ var m=months[k]; b+=m.booked; s+=m.showed; a+=m.assessments; dc+=m.dealCount; r+=m.revenue; });
  l90Avgs = {
    booked: b/3, showed: s/3, showRate: (keys.reduce(function(acc,k){return acc+months[k].showRate;},0))/3,
    assessments: a/3, showedToAssess: (keys.reduce(function(acc,k){return acc+months[k].showedToAssess;},0))/3,
    dealCount: dc/3, revenue: r/3,
    avgDeal: (keys.reduce(function(acc,k){return acc+months[k].avgDeal;},0))/3
  };
  return l90Avgs;
}

function l90Badge(cur, avg, isRate) {
  var m = isRate ? momPP(cur, avg) : momPct(cur, avg);
  return '<div class="hero-stat-change ' + m.cls + '" style="font-size:10px;opacity:0.8">' + m.val + ' vs L90</div>';
}

// ===== CHART TRACKING =====
var activeCharts = {};
function destroyCharts(prefix) {
  Object.keys(activeCharts).forEach(function(key) {
    if (key.startsWith(prefix)) {
      activeCharts[key].destroy();
      delete activeCharts[key];
    }
  });
}

      html += '<tr><td><span class="source-tag ' + ns.tagClass + '">' + ns.source + '</span></td>';
      html += '<td>' + ns.booked + '</td>';
      html += '<td><strong>' + ns.noShows + '</strong></td>';

    html += '</tbody></table>';
    html += '<div class="summary-row"><span>' + d.noShowSummary.split(':')[0] + '</span><strong>' + d.noShowSummary.split(': ')[1] + '</strong></div>';

      html += '<div style="margin-top: 8px; padding: 8px 14px; background: var(--bg-light); border-radius: 8px; font-size: 12px; color: var(--text-secondary);">' + d.noShowNote + '</div>';
    }
    html += '</div>';
  }

  // TYPEFORM FUNNEL
  var tf = d.typeform;
  html += '<div class="section">';
  html += '<div class="section-header"><div class="section-icon cyan-bg">&#128203;</div><div><div class="section-title">Typeform Funnel</div><div class="section-subtitle">Application form performance</div></div></div>';
  html += '<div class="funnel-visual">';
  // Views
  html += '<div class="funnel-step"><div class="funnel-step-label">Views</div><div class="funnel-bar-wrap"><div class="funnel-bar" style="width:100%;background:linear-gradient(90deg,var(--brand-primary),var(--brand-primary-light))">' + fmt(tf.views) + '</div></div><div class="funnel-step-pct">100%</div></div>';

  // Starts
  html += '<div class="funnel-step"><div class="funnel-step-label">Starts</div><div class="funnel-bar-wrap"><div class="funnel-bar" style="width:' + startsPct.toFixed(0) + '%;background:linear-gradient(90deg,#1a7ab5,var(--cyan-accent))">' + fmt(tf.starts) + '</div></div><div class="funnel-step-pct">' + startsPct.toFixed(1) + '%</div></div>';

  // Submissions
  var subPct = (tf.subs / tf.views * 100);
  html += '<div class="funnel-step"><div class="funnel-step-label">Submissions</div><div class="funnel-bar-wrap"><div class="funnel-bar" style="width:' + Math.max(subPct, 8).toFixed(0) + '%;background:linear-gradient(90deg,#1e9e38,var(--success))">' + fmt(tf.subs) + '</div></div><div class="funnel-step-pct">' + pct(tf.overall) + '</div></div>';
  html += '</div>';
  html += '<div class="summary-row"><span>Overall Conversion (Views to Submissions)</span><strong>' + pct(tf.overall) + '</strong></div>';
  html += '</div>';

  html += '</div>'; // end main
  return html;
}

// ===== TAB SWITCHING =====
function switchTab(tabId) {
  // Destroy all existing charts
  Object.keys(activeCharts).forEach(function(key) {
    activeCharts[key].destroy();
    delete activeCharts[key];
  });

  // Hide all tab content, deactivate pills
  document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('active'); });
  document.querySelectorAll('.tab-pill').forEach(function(el) { el.classList.remove('active'); });

  // Activate selected tab
  var tabEl = document.getElementById('tab-' + tabId);
  var pill = document.querySelector('[data-tab="' + tabId + '"]');
  if (pill) pill.classList.add('active');

  // Render content if not yet rendered
  if (!tabEl.dataset.rendered) {
    if (tabId === 'l90') {
      tabEl.innerHTML = renderL90Tab();
    } else {
      tabEl.innerHTML = renderMonthTab(tabId);
    }
    tabEl.dataset.rendered = '1';
  }

  tabEl.classList.add('active');

  // Create charts for active tab
  if (tabId === 'l90') {
    createL90Charts();
  } else {
    createOutcomeChart(tabId);
  }

  // Update URL hash
  history.replaceState(null, '', '#' + tabId);

  // Scroll to top
  window.scrollTo(0, 0);
}

// ===== INIT =====
document.querySelectorAll('.tab-pill').forEach(function(pill) {
  pill.addEventListener('click', function() {
    switchTab(this.dataset.tab);
  });
});

// Default tab from hash or 'jun'
var initialTab = window.location.hash.replace('#', '') || 'jul';
if (!['mar','apr','may','jun','jul','l90'].includes(initialTab)) initialTab = 'jul';
switchTab(initialTab);

// Handle hash changes
window.addEventListener('hashchange', function() {
  var tab = window.location.hash.replace('#', '');
  if (['mar','apr','may','jun','jul','l90'].includes(tab)) {
    switchTab(tab);
  }
});
